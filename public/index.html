<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Lipy Live</title>
<style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh}img{max-width:100%;max-height:100vh}#status{position:absolute;top:10px;color:#fff}</style>
</head><body>
<div id="status">Waiting for phone...</div>
<img id="view" />
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
socket.on('laptop-view', (d) => { document.getElementById('status').style.display='none'; document.getElementById('view').src = d; });
</script></body></html>
